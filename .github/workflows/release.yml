name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          generate_release_notes: true
