name: Feature request
description: Propose a product or engineering improvement
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend
        - Blockchain
        - Documentation
        - DevOps
        - Security
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
